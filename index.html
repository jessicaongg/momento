<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDF9EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="momento">
<title>momento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + 5 tabs; one narrow working column (max 880px), rows not cards, metal swatches carry the identity. */
:root{
  --bg:#F5EEE7; --surface:#FFFBF8; --sunk:#EFE3DA; --ink:#3D2F2C; --muted:#8A746D; --line:#E9D9CF;
  --primary:#A86F69; --on-primary:#FFFFFF;
  --yg:#C9A43A; --ss:#A4AAB6; --rg:#D7958A; --mix:#8E86A8;
  --warn:#A8591A; --warn-bg:#FBEBDD; --ok:#2C7A57; --ok-bg:#E1F2EA; --bad:#B0344A; --bad-bg:#F9E3E7;
  --pj:#7A5C1E; --pj-bg:#F6EDD6; --kc:#2F5E78; --kc-bg:#DDEBF3;
  --gold:#B09658; --cream:#FDF9EF; --nolink-bg:#F1EFED; --due-bg:#FBE6E6;
  --f-logo:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* Light mode only (owner's preference), whatever the device setting. */
:root,:root[data-theme="dark"]{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand h1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-logo);font-weight:500;font-size:2rem;line-height:1;color:var(--gold);letter-spacing:.01em}
.tag{font:600 .68rem var(--f-body);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
header,body::before{background:var(--cream)!important}
.brand h1 .dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.brand h1 .dots i{width:8px;height:8px;border-radius:50%;display:block}
.who{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap}
.who select{width:auto;padding:5px 8px;font-weight:700;color:var(--ink);border-radius:999px}
.who.unset select{border-color:var(--primary);background:var(--sunk);color:var(--primary)}
.whobtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whobtns .btn{justify-content:center;padding:16px;font-size:1rem}
.act b{font-weight:700}
.act .when{font-size:.75rem;color:var(--muted);white-space:nowrap}
.me{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);min-width:0}
.me img{width:26px;height:26px;border-radius:50%}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
@media (max-width:440px){nav button{font-size:.72rem;padding-inline:0}}
.stat.neg b{color:var(--bad)}
.settle{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.settle .people{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem}
.catbar{display:flex;gap:6px;flex-wrap:wrap}
nav button{appearance:none;border:0;background:none;color:var(--muted);font:600 .86rem var(--f-body);padding:10px 2px 11px;border-bottom:2.5px solid transparent;cursor:pointer;position:relative}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--primary)}
.chip[aria-pressed="true"]{background:var(--primary)!important;color:var(--on-primary)!important;border-color:var(--primary)!important}
nav button .badge{position:absolute;top:4px;margin-left:2px;background:var(--warn);color:var(--surface);font-size:.65rem;border-radius:9px;padding:0 5px;line-height:15px}
main{padding-block:20px 40px}
section{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0;text-wrap:balance}
h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:8px 0 0;font-weight:700}
p.note{color:var(--muted);margin:0;font-size:.88rem;max-width:62ch}
.num{font-variant-numeric:tabular-nums}

/* buttons & inputs */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .88rem var(--f-body);padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.small{padding:5px 10px;font-size:.8rem;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--ink);font-weight:500}
.checks label{display:flex;align-items:center;gap:6px}
.checks input{width:auto}

/* chips & pills */
.filters{display:flex;flex-direction:column;gap:8px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .8rem var(--f-body);padding:5px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.fin{background:var(--cream);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pill.un{background:var(--sunk);color:var(--muted)} .pill.pj{background:var(--pj-bg);color:var(--pj)} .pill.kc{background:var(--kc-bg);color:var(--kc)}
.pill.low{background:var(--warn-bg);color:var(--warn)} .pill.out{background:var(--bad-bg);color:var(--bad)}
.pill.uncounted{background:var(--sunk);color:var(--muted)}
.sw{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.YG{background:var(--yg)} .sw.SS{background:var(--ss)} .sw.RG{background:var(--rg)} .sw.mixed{background:conic-gradient(var(--yg) 0 33%,var(--ss) 0 66%,var(--rg) 0)} .sw.none{background:var(--sunk)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:620px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
.stat small{font-size:.75rem;color:var(--muted)}
.stat.alert b{color:var(--warn)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.nolink{background:var(--nolink-bg)}
.row.due{background:var(--due-bg)}
.row.nolink .main.clickable:hover,.row.due .main.clickable:hover{background:transparent}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .title{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.row .sub{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.row .end{display:flex;align-items:center;gap:8px;flex:none}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:var(--sunk)}
.fav{appearance:none;border:0;background:none;font-size:1.25rem;line-height:1;color:var(--muted);cursor:pointer;padding:0 2px 0 0}
.fav[aria-pressed="true"]{color:var(--gold)}
.fav:disabled{cursor:default}
.thumb{width:46px;height:46px;border-radius:9px;flex:none;position:relative;background:var(--sunk);border:1px solid var(--line);padding:0;overflow:hidden;display:grid;place-items:center;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .sw{position:absolute;right:3px;bottom:3px;width:10px;height:10px;box-shadow:0 0 0 1.5px var(--surface)}
.thumb.empty{cursor:default}.thumb.empty .sw{position:static;width:14px;height:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.thumb.broken img{display:none}
.thumb.big{width:88px;height:88px;cursor:default}
.photo-edit{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-full{width:100%;border-radius:12px;display:block;background:var(--sunk)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 1rem var(--f-body);cursor:pointer}
.qty .v{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
.qty .v small{font-weight:500;color:var(--muted);font-size:.72rem;margin-left:2px}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.monthhead{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--sunk);font-size:.8rem;font-weight:700;color:var(--muted);border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}
.monthhead:first-child{border-top:0}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:10px;align-items:center}
.status{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.85rem;font-weight:600}
.status[hidden]{display:none}
.check{width:22px;height:22px;flex:none;accent-color:var(--ink)}
.done .title{text-decoration:line-through;color:var(--muted)}
.specs{white-space:pre-wrap;font-size:.82rem;color:var(--ink);background:var(--sunk);border-radius:8px;padding:8px 10px;margin-top:4px}
a.ext{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.two>div{display:flex;flex-direction:column;gap:10px;min-width:0}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(15,12,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:1.3rem}
.sheet form{display:flex;flex-direction:column;gap:12px}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.sheet .actions .r{display:flex;gap:8px;margin-left:auto}
.usedrow{display:grid;grid-template-columns:1fr 116px 34px;gap:8px;align-items:center}
.uin{display:flex;align-items:center;gap:5px}
.uin .u{font-size:.78rem;color:var(--muted);font-weight:600;min-width:24px}
.uin input{flex:1 1 auto;min-width:0}
.uin select{flex:0 0 auto;min-width:76px}
.xl-step{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.xl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.xl-sum{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--sunk);border-radius:10px;font-size:.9rem}
.xl-warn{margin:0;padding-left:18px;color:var(--warn);font-size:.82rem;display:flex;flex-direction:column;gap:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.88rem;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

/* login + standalone-app base */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:40;background:var(--cream);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.login-card .logo{font-size:3rem}
.login form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login .btn{justify-content:center;padding:12px}
.keep{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink)}
.keep input{width:auto;accent-color:var(--primary)}
.who select:disabled{opacity:1;-webkit-appearance:none;appearance:none;border-color:transparent;background:none;padding-right:2px;color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1><span class="logo">momento</span><span class="tag">stock book</span></h1>
      <label class="who" for="whoSel">Logging as<select id="whoSel"><option value="">Choose…</option><option>Jessica</option><option>Valerie</option></select></label>
    </div>
    <nav id="tabs" aria-label="Sections">
      <button data-tab="overview">Overview</button>
      <button data-tab="stock">Stock</button>
      <button data-tab="sales">Sales</button>
      <button data-tab="expenses">Expenses</button>
      <button data-tab="restock">Restock</button>
      <button data-tab="links">Links</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="status" id="status" hidden></div>
  <div id="view"></div>
</main>
<footer class="wrap" style="padding-block:0 32px;color:var(--muted);font-size:.8rem;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center"><span>momento.co · co-owned by Jessica &amp; Valerie</span><button type="button" class="btn small ghost" id="signOut" hidden>Sign out</button></footer>
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="logo">momento</div>
    <p class="note" style="margin:0 auto">Stock book for Jessica &amp; Valerie</p>
    <form id="loginForm">
      <label class="f">Email<input id="lEmail" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="f">Password<input id="lPass" type="password" autocomplete="current-password" required></label>
      <label class="keep"><input type="checkbox" id="lKeep" checked> Keep me signed in on this phone</label>
      <button class="btn primary" type="submit" id="lBtn">Sign in</button>
      <p class="note" id="lMsg" role="alert"></p>
    </form>
  </div>
</div>
<div id="sheetRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
const CAT = {chain:"Chain", jumpring:"Jump ring", charm:"Charm", findings:"Findings", other:"Other supply"};
const METAL = {YG:"Yellow gold", SS:"Sterling silver", RG:"Rose gold", mixed:"Mixed", "":"No metal"};
const LINE = {pj:"Permanent jewellery", kc:"Keychain"};
const LINE_SHORT = {pj:"PJ", kc:"Keychain", un:"Unsure"};
const PRODUCTS = {pj:["Bracelet","Anklet","Necklace","Ring","Other"], kc:["Bottle keychain","Keychain","Other"]};
const PAY = ["PayNow","Cash","Card","PayLah","Other"];
// Starting estimates for chain used per piece (cm); editable in the app under Stock → Chain lengths.
const PEOPLE = ["Jessica","Valerie"];
const PAYERS = [...PEOPLE, "Both"];   // "Both" = split 50/50 when paid, so it doesn't change who owes whom
const EXP_CAT = {stock:"Stock & supplies", onetime:"One-time / equipment", admin:"Admin & fees", marketing:"Packaging & marketing", other:"Other"};
// Currencies the app can convert to SGD (rates from the European Central Bank via frankfurter.dev).
const CURS = {SGD:"S$", USD:"US$", MYR:"RM", CNY:"CN¥", EUR:"€", GBP:"£", AUD:"A$", HKD:"HK$", JPY:"JP¥", KRW:"₩", THB:"฿", IDR:"Rp", PHP:"₱", INR:"₹"};
const NO_DEC = ["JPY","KRW","IDR"];
const curOpts = c => Object.keys(CURS).map(k => `<option ${k===c?"selected":""}>${k}</option>`).join("");
function curCode(v){
  const s = String(v ?? "").trim().toUpperCase().replace(/\s/g,"");
  if (!s) return "SGD";
  const alias = {"S$":"SGD","SG$":"SGD","US$":"USD","USD$":"USD","RM":"MYR","RMB":"CNY","€":"EUR","£":"GBP","A$":"AUD","HK$":"HKD"};
  if (alias[s]) return alias[s];
  return CURS[s] ? s : null;
}
function fmtCur(n, c){
  if (!c || c === "SGD") return "S$" + (Number(n)||0).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});
  const d = NO_DEC.includes(c) ? 0 : 2;
  return (CURS[c] || c+" ") + (Number(n)||0).toLocaleString("en-SG",{minimumFractionDigits:d,maximumFractionDigits:d});
}
const rateCache = {};
// SGD for 1 unit of `cur` on `date` (YYYY-MM-DD) or the latest rate. Weekends use the previous working day.
function getRate(cur, date){
  if (!cur || cur === "SGD") return Promise.resolve(1);
  const d = date && /^\d{4}-\d{2}-\d{2}$/.test(date) && date < today() ? date : "latest";
  const k = cur + "|" + d;
  if (!rateCache[k]) rateCache[k] = fetch(`https://api.frankfurter.dev/v1/${d}?base=${cur}&symbols=SGD`)
    .then(r => r.ok ? r.json() : Promise.reject(new Error("rate")))
    .then(j => { const v = j && j.rates && j.rates.SGD; if (!v) throw new Error("rate"); return v; })
    .catch(e => { delete rateCache[k]; throw e; });
  return rateCache[k];
}
const fxLatest = {};
function ensureFx(cur){
  if (!cur || cur === "SGD" || cur in fxLatest) return;
  fxLatest[cur] = null;
  getRate(cur).then(v => { fxLatest[cur] = v; render(); }).catch(() => { delete fxLatest[cur]; });
}
const sumAmt = arr => arr.reduce((a,x)=>a+(Number(x.amount)||0),0);
const sumPrice = arr => arr.reduce((a,s)=>a+(Number(s.price)||0),0);
const LEN_KEYS =["Bracelet","Anklet","Necklace","Ring","Bottle keychain","Keychain"];
const DEFAULT_LEN = {Bracelet:17, Anklet:24, Necklace:45, Ring:6, "Bottle keychain":12, Keychain:12};

const S = {
  items:[], sales:[], links:[], shop:[], activity:[], expenses:[], deadstock:[], settle:[], who:"",
  loaded:{items:false,sales:false,links:false,shop:false,activity:false,expenses:false,deadstock:false,settle:false},
  ef:{month:"all",cat:"all",who:"all"},
  tab:"overview", f:{cat:"all",metal:"all",line:"all",q:""}, sf:{month:"all",line:"all",who:"all"},
  canWrite:true, me:null, names:{}, db:null, user:null, lengths:{...DEFAULT_LEN}
};

function stockState(it){

function mapKarat(v){ const t = String(v ?? "").toLowerCase(); const m = t.match(/\b(14|18|24)\s*(k|kt|ct|karat|carat)?\b/); if (m && (m[2] || /^\s*(14|18|24)\s*$/.test(t))) return m[1];
  if (/\b585\b/.test(t)) return "14"; if (/\b750\b/.test(t)) return "18"; if (/\b(999|24k)\b/.test(t)) return "24"; return ""; }
const finishFromText = t => { t = String(t || "").toLowerCase(); return /gold[\s-]*filled|\bgf\b/.test(t) ? "filled" : /plated|vermeil/.test(t) ? "plated" : /\bsolid\b/.test(t) ? "solid" : ""; };
const karatFromText = t => { const m = String(t || "").toLowerCase().match(/\b(14|18|24)\s*(k|kt|ct|karat|carat)\b/); return m ? m[1] : ""; };
const FINISH = {"":"Not set", solid:"Solid", filled:"Gold filled", plated:"Gold plated"};
function mapFinish(v){ const t = String(v ?? "").toLowerCase(); return /fill/.test(t) ? "filled" : /plat/.test(t) ? "plated" : /solid/.test(t) ? "solid" : ""; }
const WRITE_OFF = {damaged:"Damaged", defective:"Defective", lost:"Lost", unsellable:"Won't sell", other:"Other"};

async function shrink(file){
  try {
    const url = URL.createObjectURL(file); const img = new Image();
    const ok = await new Promise(res => { const t = setTimeout(() => res(false), 6000); img.onload = () => { clearTimeout(t); res(true); }; img.onerror = () => { clearTimeout(t); res(false); }; img.src = url; });
    if (!ok || !img.naturalWidth) { URL.revokeObjectURL(url); return file; }
    const sc = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch(e) { return file; }
}

function bindPhoto(form){
  const inp = form.querySelector("#phInput"); if (!inp) return;
  const hid = form.querySelector("[name=photo]"), box = form.querySelector(".thumb.big"), st = form.querySelector("#phStatus"),
        rm = form.querySelector("#phRemove"), sub = form.querySelector("[type=submit]");
  inp.addEventListener("change", async () => {
    const f = inp.files[0]; if (!f) return;
    st.textContent = "Uploading…"; sub.disabled = true;
    try {
      const blob = await shrink(f);
      const r = await S.assets.upload(blob, {type: blob.type || "image/jpeg"});
      hid.value = r.id; box.innerHTML = `<img src="${esc(r.url)}" alt="">`; rm.hidden = false;
      st.textContent = "Photo added. Tap Save to keep it.";
    } catch(e) {
      st.textContent = e?.code==="too_large" ? "That photo is too big. Try a smaller one."
        : e?.code==="unsupported_type" ? "That file type isn't supported. Use a JPG or PNG photo."
        : e?.code==="quota_or_state" ? "Photo storage is full."
        : "Couldn't upload the photo. Try again.";
    }
    sub.disabled = false; inp.value = "";
  });
  rm.addEventListener("click", () => { hid.value = ""; box.innerHTML = ""; rm.hidden = true; st.textContent = "Photo removed. Tap Save to confirm."; });
}

function guessCat(t){ t = (t||"").toLowerCase(); return /jump ?ring/.test(t) ? "jumpring" : /chain/.test(t) ? "chain" : /charm|pendant|birthstone/.test(t) ? "charm" : /finding|clasp|lobster|connector|bail|ear ?wire|earring hook|crimp|end cap|spring ring|toggle|key ?ring|split ring/.test(t) ? "findings" : "other"; }
function newItemFromLink(link, qty, unit, sgd){
  return {name: link.title, cat: link.connector ? "charm" : guessCat(link.title), metal: link.metal || "", finish: link.finish || "", karat: link.karat || karatFromText(link.title),
    connector: !!link.connector || (/connector/i.test(link.title || "") && guessCat(link.title) === "charm"), style: "", lines: (link.lines && link.lines.length) ? link.lines : ["pj"],
    qty, unit: unit || "pcs", lowAt: null, cost: qty && sgd ? Math.round(sgd / qty * 100) / 100 : null, linkId: link.id, notes: "", photo: link.photo || "", ...stamp()};
}
// "link:<id>" or "item:<id>" → the supplier link and the stock item it feeds (if any)
function resolveSrc(v){
  const [kind, id] = String(v || "").split(":");
  if (kind === "link") { const link = linkById(id); return {link, item: link ? S.items.find(i => i.linkId === link.id) : null}; }
  if (kind === "item") return {link: null, item: itemById(id)};
  return {link: null, item: null};
}

// An expense is a stock order when it names a product link or stock item and a quantity.
// It only goes into stock once it's marked delivered. Older expenses saved before this existed count as delivered.
const isDelivered = x => x.delivered === true || (x.delivered === undefined && !!x.itemId && x.qty != null);
const isPending = x => !isDelivered(x) && Number(x.qty) > 0 && !!(x.linkId || x.itemId);
const srcOf = x => x.linkId ? "link:" + x.linkId : x.itemId ? "item:" + x.itemId : "";
function stockTarget(x){
  const link = x.linkId ? linkById(x.linkId) : null;
  const item = (x.itemId ? itemById(x.itemId) : null) || (link ? S.items.find(i => i.linkId === link.id) : null);
  return {link, item};
}
async function deliver(expId){
  const x = S.expenses.find(e => e.id === expId);
  if (!x || isDelivered(x)) return null;
  const qty = Number(x.qty); if (!qty) return null;
  const {link, item} = stockTarget(x);
  let itemId = "", made = false;
  if (item) { itemId = item.id; await adjustStock([{itemId, qty}], +1); }
  else if (link) { const r = S.db.collection("items").doc(); itemId = r.id; made = true; await r.set({...newItemFromLink(link, qty, x.unit || "pcs", x.amount), photo: link.photo || x.photo || "", finish: x.finish || link.finish || "", karat: x.karat || link.karat || karatFromText(link.title)}); }
  else return null;
  await S.db.collection("expenses").doc(expId).update({delivered:true, deliveredAt:Date.now(), itemId});
  const it = itemById(itemId) || {unit: x.unit};
  logAct(`marked ${x.desc} as delivered: ${fmtQ(it, qty)} added to stock${made ? " as a new item" : ""}`);
  return {itemId, made};
}

function expRow(x){
  const {link, item} = stockTarget(x);
  const pend = isPending(x);
  const sub = [fmtDate(x.date), EXP_CAT[x.cat], x.karat ? KARAT[x.karat] : "", x.finish ? FINISH[x.finish] : "", x.who ? "paid by "+x.who : "", x.pay, x.shop].filter(Boolean).map(esc).join(" · ");
  const stockLine = isDelivered(x) && item && x.qty ? `Added to stock: ${fmtQ(item, x.qty)} of ${item.name}`
    : pend ? `On the way: ${x.qty} ${x.unit || item?.unit || ""} of ${item?.name || link?.title || "stock"}`
    : x.qty ? `Quantity: ${x.qty} ${x.unit || ""}`.trim() : "";
  const disc = Number(x.discount) > 0 ? `Saved ${fmtCur(x.discount, x.currency)}${x.discountFor ? " (" + x.discountFor + ")" : ""}` : "";
  return `<div class="row clickable" data-a="editExp" data-id="${x.id}" role="button" tabindex="0">
    ${x.photo ? thumb(x.photo, "", "receipt") : ""}
    <div class="main"><div class="title">${esc(x.desc || EXP_CAT[x.cat] || "Expense")} ${pend ? `<span class="pill low">Waiting for delivery</span>` : ""}</div><div class="sub">${sub}</div>
      ${stockLine ? `<div class="sub">${esc(stockLine)}</div>` : ""}${disc ? `<div class="sub">${esc(disc)}</div>` : ""}
      ${pend && S.canWrite ? `<div><button type="button" class="btn small" data-a="deliver" data-id="${x.id}">Mark delivered</button></div>` : ""}</div>
    <div class="end" style="flex-direction:column;align-items:flex-end;gap:2px"><span class="money">${money(x.amount)}</span>${x.currency && x.currency !== "SGD" ? `<span class="sub num">${esc(fmtCur(x.origAmount, x.currency))}</span>` : ""}</div>
  </div>`;
}

// Running tab between the two of you. Every expense is shared 50/50:
// whoever paid alone is owed half by the other; "Both" splits on the spot. Paybacks reduce what's owed.
function tabBalance(){
  const [A, B] = PEOPLE;
  const paid = Object.fromEntries(PAYERS.map(p => [p, sumAmt(S.expenses.filter(x => x.who === p))]));
  const backTo = p => S.settle.filter(x => x.to === p).reduce((a, x) => a + (Number(x.amount) || 0), 0);
  // positive: B owes A
  const owed = Math.round(((paid[A] - paid[B]) / 2 - backTo(A) + backTo(B)) * 100) / 100;
  return {A, B, paid, owed, debtor: owed > 0 ? B : A, creditor: owed > 0 ? A : B, amount: Math.abs(owed), even: Math.abs(owed) < 0.005,
    paybacks: [...S.settle].sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0))};
}
function tabBox(t){
  const line = t.even ? "You're even. Nobody owes anything." : `${t.debtor} owes ${t.creditor} ${money(t.amount)}.`;
  return `<div class="settle">
    <h3 style="margin:0">Tab between you</h3>
    <div class="people num">${PAYERS.map(p => `<span><b>${p === "Both" ? "Both (split)" : p}</b> paid ${money(t.paid[p])}</span>`).join("")}<span><b>Total</b> ${money(sumAmt(S.expenses))}</span></div>
    <p style="margin:2px 0 0;font-weight:700;font-size:1.02rem" class="num">${esc(line)}</p>
    <p class="note">Every expense is shared 50/50. Whoever paid alone is owed half by the other; "Both" means you split it when you paid. Paybacks bring the balance down.</p>
    ${S.canWrite ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn small primary" data-a="newPayback">Settle up</button></div>` : ""}
    ${t.paybacks.length ? `<details><summary class="note" style="cursor:pointer">Paybacks (${t.paybacks.length})</summary>
      <div class="list" style="margin-top:8px">${t.paybacks.slice(0, 50).map(x => `<div class="row${S.canWrite ? " clickable" : ""}" ${S.canWrite ? `data-a="editPayback" data-id="${x.id}" role="button" tabindex="0"` : ""}>
        <div class="main"><div class="title">${esc(x.from)} paid ${esc(x.to)} back</div><div class="sub">${esc([fmtDate(x.date), x.note].filter(Boolean).join(" · "))}</div></div>
        <div class="end"><span class="money">${money(x.amount)}</span></div></div>`).join("")}</div></details>` : ""}
  </div>`;
}
function paybackForm(x){
  const t = tabBalance();

  openSheet(`<h2>${x ? "Edit payback" : "Settle up"}</h2>

      <div class="grid2">

      if (data.from === data.to) throw {code: "same"};
      if (x) await S.db.collection("settle").doc(x.id).update({...data, ...stamp()});
      else await S.db.collection("settle").doc().set({...data, who: S.who || "", createdAt: Date.now()});
      toast(x ? "Payback updated" : "Payback recorded");
      logAct(`${x ? "edited a payback" : "recorded a payback"}: ${data.from} paid ${data.to} ${money(data.amount)}`);
    }, form => bindDelete(form, async () => { await S.db.collection("settle").doc(x.id).delete(); toast("Payback deleted"); logAct(`deleted a payback: ${x.from} paid ${x.to} ${money(x.amount)}`); }));

/* ---------- names ---------- */
let resolving = false;
async function resolveNames(){
  if (!S.user || resolving) return;
  const ids = new Set();
  S.sales.forEach(s=>s.by&&ids.add(s.by)); S.shop.forEach(s=>{s.by&&ids.add(s.by); s.doneBy&&ids.add(s.doneBy);});
  const missing = [...ids].filter(id => !(id in S.names));
  if (!missing.length) return;
  resolving = true;
  try {
    const ps = await S.user.profiles(missing);
    let changed = false;
    missing.forEach(id => { const n = ps[id]?.isMe ? "you" : (ps[id]?.name || "Someone"); if (S.names[id] !== n) { S.names[id] = n; changed = true; } });
    resolving = false;
    if (changed) render();
  } catch(e) { resolving = false; }
}

/* ---------- sheet forms ---------- */
function openSheet(html, onSubmit, onReady){
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="overlay" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const form = root.querySelector("form");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = form.querySelector("[type=submit]"); btn.disabled = true;
    try { await onSubmit(new FormData(form), form); closeSheet(); }
    catch(err) { btn.disabled = false; toast(writeError(err)); }
  });
  onReady && onReady(form);
  const first = form.querySelector("input,select,textarea"); first && first.focus();
}
function closeSheet(){ $("#sheetRoot").innerHTML = ""; }
function writeError(err){
  if (err && err.code === "same") return "Pick two different people.";
  if (err && err.code === "fx") return "Couldn't get the exchange rate. Type the rate in and save again.";
  if (err && err.code === "invalid_argument") { S.canWrite = false; render(); return "This login isn't allowed to make changes. Check the members list in Supabase."; }
  if (err && err.code === "quota_exceeded") return "Storage is full. Delete old entries and try again.";
  return "Couldn't save. Check your connection and try again.";
}

/* ---------- activity log ---------- */
function logAct(text){
  if (!S.db) return;
  S.db.collection("activity").doc().set({at: Date.now(), who: S.who || "", text}).catch(() => {});
}
const fmtQ = (it, q) => q == null ? "—" : `${Math.round(q*100)/100} ${it.unit||""}`.trim();
const pendingQty = {};
// Group quick −/+ taps on one item into a single log line once tapping stops.
function logQty(it, from, to){
  const p = pendingQty[it.id] ||= {from};
  p.to = to; clearTimeout(p.timer);
  p.timer = setTimeout(() => { delete pendingQty[it.id]; if (p.from !== p.to) logAct(`changed ${it.name}: ${fmtQ(it,p.from)} → ${fmtQ(it,p.to)}`); }, 4000);
}
function ago(t){
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " h ago";
  return new Date(t).toLocaleDateString("en-SG", {day:"numeric", month:"short"});
}

      const pEl = form.querySelector("[name=price]"), dEl = form.querySelector("[name=discount]"), paidEl = form.querySelector("#salePaid");
      const showPaid = () => { const pr = numOrNull(pEl.value), d = Math.min(numOrNull(dEl.value) || 0, pr || 0);
        paidEl.textContent = pr != null && d ? `Customer pays ${money(pr - d)} after ${money(d)} off.` : ""; };
      pEl.addEventListener("input", showPaid); dEl.addEventListener("input", showPaid); showPaid();
      // Fill in the usual chain length for this product, unless someone typed their own.
      const autoLen = row => {
        const sel = row.querySelector("[name=usedItem]"), q = row.querySelector("[name=usedQty]");
        if (!isM(itemById(sel.value)) || !(q.value === "" || q.dataset.auto === "1")) return;
        const L = S.lengths[prodSel.value];
        if (L) { q.value = L; q.dataset.auto = "1"; }
      };
      const autoAll = () => form.querySelectorAll(".usedrow").forEach(autoLen);
      lineSel.addEventListener("change", autoAll);
      prodSel.addEventListener("change", autoAll);
      form.addEventListener("change", ev => {
        if (ev.target.name === "usedItem") { const row = ev.target.closest(".usedrow"); row.querySelector(".u").textContent = unitFor(ev.target.value); autoLen(row); }
      });
      form.addEventListener("input", ev => { if (ev.target.name === "usedQty") ev.target.dataset.auto = "0"; });
      form.addEventListener("click", ev => {
        const t = ev.target.closest("[data-a]"); if (!t) return;
        if (t.dataset.a==="addUsed") { form.querySelector("#usedList").insertAdjacentHTML("beforeend", usedRow()); }

      bindDelete(form, async (restore) => {
        if (restore) await adjustStock(s.used||[], +1);

        logAct(`deleted a sale: ${s.product||"Sale"}, ${money(s.price)}${restore?" (stock returned)":""}`);
      });
    });
}

async function adjustStock(used, sign){
  const totals = {};
  used.forEach(u => totals[u.itemId] = (totals[u.itemId]||0) + u.qty);
  for (const [id,q] of Object.entries(totals)) {
    const it = itemById(id); if (!it || (it.qty == null && sign < 0)) continue;
    const next = Math.max(0, Math.round(((it.qty||0) + sign*q)*10000)/10000);
    await S.db.collection("items").doc(id).update({qty:next, ...stamp()});
  }
}

// Picking a supplier link in the stock form fills in its details. Fields the person has
// changed themselves are left alone; on an existing item only empty fields are filled.
// Type-to-narrow for link pickers. Common product words (chain, charm, pcs, mm...) are ignored
// unless they're all you typed; favourites come first.
const COMMON_WORDS = new Set(["chain","chains","charm","charms","connector","connectors","pendant","pendants","bead","beads",
  "pc","pcs","piece","pieces","set","pack","mm","cm","the","and","for","with","of","x","order","item","items"]);
// metal names count the same as their short codes (Sterling silver = SS, etc.)
const metalCodes = t => norm(t).replace(/sterling\s+silver|\bsilver\b|\b925\b/g, " ss ").replace(/yellow\s+gold/g, " yg ").replace(/rose\s+gold/g, " rg ");
const nameWords = t => metalCodes(t).split(/[^a-z0-9]+/).filter(w => w.length > 1);
const queryWords = t => { const w = nameWords(t); const k = w.filter(x => !COMMON_WORDS.has(x)); return k.length ? k : w; };
const matchScore = (t, q) => { const ws = nameWords(t); return q.reduce((a, k) => a + (ws.includes(k) ? 2 : ws.some(w => w.startsWith(k) || (k.startsWith(w) && w.length > 2)) ? 1 : 0), 0); };
function attachSearch({sel, q, hint, also, list, empty, initial}){
  if (!sel || !q) return;
  const rebuild = text => {
    const cur = sel.value, qw = queryWords(text);
    let shown = list, none = false;
    if (qw.length) {
      const hits = list.map(o => ({...o, s: matchScore(o.t, qw)})).filter(o => o.s > 0 || o.v === cur).sort((a,b) => b.s - a.s || (b.fav ? 1 : 0) - (a.fav ? 1 : 0));
      if (hits.some(o => o.s > 0)) shown = hits; else none = true;
    }
    const groups = {}; shown.forEach(o => (groups[o.g] ||= []).push(o));
    sel.innerHTML = `<option value="">${esc(empty)}</option>` + Object.entries(groups).map(([g, os]) =>
      `<optgroup label="${esc(g)}">${os.map(o => `<option value="${o.v}" ${o.v === cur ? "selected" : ""}>${esc(o.t)}</option>`).join("")}</optgroup>`).join("");
    if (hint) hint.textContent = !qw.length ? "" : none ? "· no similar names, showing all" : `· ${shown.filter(o => o.s > 0).length} similar to the name`;
  };
  q.addEventListener("input", () => rebuild(q.value));
  if (also) also.addEventListener("input", () => { if (!q.value && !sel.value) rebuild(also.value); });
  rebuild(initial || "");
}
const linkChoices = () => [...S.links].sort((a,b)=>(b.fav ? 1 : 0) - (a.fav ? 1 : 0) || (a.title||"").localeCompare(b.title||""))
  .map(l => ({v: l.id, g: l.fav ? "★ Favourites" : "Supplier links", t: (l.fav ? "★ " : "") + l.title + (l.shop ? " — " + l.shop : ""), fav: !!l.fav}));

// SGD cost of one unit from a link's price and pack size (e.g. US$12.50 per "1 m" → per m)
async function linkUnitCost(l, unit){
  if (l.price == null || l.price === "") return null;
  const m = String(l.pack || "").match(/([\d.]+)\s*(m|cm|mm|pcs?|pieces?|ft|inch)?\b/i);
  let n = m ? parseFloat(m[1]) || 1 : 1; const pu = m && m[2] ? m[2].toLowerCase() : "";
  if (pu === "cm" && unit === "m") n = n / 100; else if (pu === "m" && unit === "cm") n = n * 100;
  let rate = 1;
  if ((l.priceCur || "SGD") !== "SGD") { try { rate = await getRate(l.priceCur); } catch(e) { return null; } }
  return n > 0 ? Math.round(Number(l.price) / n * rate * 100) / 100 : null;
}
const specsLine = l => { const t = String(l.specs || "").split(/\n+/).map(x => x.trim()).filter(Boolean).join(", "); return t.length > 160 ? t.slice(0, 157) + "…" : t; };
// Connect a link to an existing stock item and fill each side's missing details from the other.
async function connectLinkToItem(link, item){
  const patch = {linkId: link.id}, got = [];
  if (!item.finish && link.finish) { patch.finish = link.finish; got.push("finish"); }
  const lk = link.karat || karatFromText(link.title); if (!item.karat && lk) { patch.karat = lk; got.push("karat"); }
  if (!item.style && link.specs) { patch.style = specsLine(link); got.push("details"); }
  if (item.cost == null || item.cost === "") { const c = await linkUnitCost(link, item.unit || "pcs"); if (c != null) { patch.cost = c; got.push("cost per unit"); } }
  if (!item.photo && link.photo) { patch.photo = link.photo; got.push("photo"); }
  if (link.connector && item.cat === "charm" && !item.connector) { patch.connector = true; got.push("connector"); }
  await S.db.collection("items").doc(item.id).update({...patch, ...stamp()});
  const lp = {};
  if (!link.metal && item.metal) lp.metal = item.metal;
  if (!link.finish && item.finish) lp.finish = item.finish;
  if (!link.karat && item.karat) lp.karat = item.karat;
  if (!(link.lines || []).length && (item.lines || []).length) lp.lines = item.lines;
  if (!link.photo && item.photo) lp.photo = item.photo;
  if (Object.keys(lp).length) await S.db.collection("links").doc(link.id).update(lp);
  return got;
}

function fillFromLink(form, it){
  const linkSel = form.querySelector("[name=linkId]"); if (!linkSel) return;
  const mark = ev => { if (ev.target !== linkSel && ev.target.name) ev.target.dataset.touched = "1"; };
  form.addEventListener("input", mark); form.addEventListener("change", mark);
  linkSel.addEventListener("change", async () => {
    const l = linkById(linkSel.value); if (!l) return;
    const el = n => form.querySelector(`[name="${n}"]`);
    const set = (n, val, onlyIfEmpty) => { const e = el(n); if (!e || val == null || val === "" || e.dataset.touched) return false; if (onlyIfEmpty && e.value) return false; e.value = val; return true; };
    const filled = [];
    if (set("name", l.title, true)) filled.push("name");
    if (!it) {
      const cat = guessCat(l.title);
      if (set("cat", cat)) filled.push("type");
      if (set("metal", l.metal)) filled.push("metal");
      if (set("finish", l.finish)) filled.push("finish");
      if (set("karat", l.karat || karatFromText(l.title))) filled.push("karat");
      const isConn = !!l.connector || (/connector/i.test(l.title || "") && cat === "charm");
      if (isConn && el("connector") && !el("connector").dataset.touched) { el("connector").checked = true; if (!el("cat").dataset.touched) el("cat").value = "charm"; filled.push("connector"); }
      form._connToggle && form._connToggle();
      if (set("unit", cat === "chain" ? "m" : "pcs")) filled.push("unit");
      if (l.lines && l.lines.length && !["pj","kc","un"].some(k => el(k)?.dataset.touched)) { ["pj","kc","un"].forEach(k => { if (el(k)) el(k).checked = l.lines.includes(k); }); filled.push("used for"); }
    } else {
      if (!it.finish && set("finish", l.finish, true)) filled.push("finish");
      if (!it.karat && set("karat", l.karat || karatFromText(l.title), true)) filled.push("karat");
    }
    // details: the link's specifications, one line
    const specs = specsLine(l);
    if (specs && set("style", specs, true)) filled.push("details");
    // cost per unit: price ÷ pack size, in SGD
    if (!el("cost")?.value && !el("cost")?.dataset.touched) {
      const c = await linkUnitCost(l, el("unit")?.value || "pcs");
      if (c != null && set("cost", c, true)) filled.push("cost per unit");
    }
    const ph = el("photo");
    if (l.photo && ph && !ph.value) {
      ph.value = l.photo; form.querySelector(".thumb.big").innerHTML = `<img src="${esc(photoSrc(l.photo))}" alt="">`;
      const rm = form.querySelector("#phRemove"); if (rm) rm.hidden = false; filled.push("photo");
    }
    if (filled.length) toast("Filled in from the link: " + filled.join(", "));
  });
}

  (stockRows||[]).forEach((r, i) => {
    const name = txt(pick(r,"name","item")); if (!name) return;
    const idIn = txt(pick(r,"id")); const ex = idIn ? itemById(idIn) : S.items.find(i => norm(i.name) === norm(name)) || null;
    if (idIn && !ex) plan.warnings.push(`Stock row ${i+2}: ID “${idIn}” isn't in the app, so it was added as new.`);
    const supplier = txt(pick(r,"supplier link","supplier"));
    let linkId = "";
    if (supplier) { linkId = byTitle.get(norm(supplier)) || ex?.linkId || "";
      if (!byTitle.get(norm(supplier))) plan.warnings.push(`Stock row ${i+2}: supplier link “${supplier}” doesn't match a Product name on the Links sheet, so it wasn't changed.`); }
    const data = {name, cat:mapCat(pick(r,"type","category"), ex?.cat), metal:mapMetal(pick(r,"metal")),
      style:txt(pick(r,"style / details","style","details")), lines:mapLines(pick(r,"used for"), ex?.lines),
      qty:numCell(pick(r,"in stock","qty","quantity")), unit:mapUnit(pick(r,"unit"), ex?.unit), lowAt:numCell(pick(r,"restock at")),
      cost:numCell(pick(r,"cost per unit","cost")), linkId, notes:txt(pick(r,"notes")),
      dead: /^(y|yes|true|1|dead)$/.test(norm(pick(r,"dead stock"))), finish: mapFinish(pick(r,"finish")), karat: mapKarat(pick(r,"karat","carat","ct")),
      connector: /^(y|yes|true|1|connector)$/.test(norm(pick(r,"connector")))};
    if (data.connector && data.cat !== "charm") data.connector = false;
    const id = ex ? ex.id : S.db.collection("items").doc().id;
    itemNames.set(norm(name), id);
    if (ex) { if (same(ex, data)) plan.c.ss++; else { plan.c.sc++; plan.writes.push({col:"items", id, data, isNew:false}); } }
    else { plan.c.sn++; plan.writes.push({col:"items", id, data, isNew:true}); }
  });
  await doExpenses();
  if (!stockRows && !linkRows && !expRows) plan.warnings.push("No Stock, Links or Expenses sheet was found in this file.");
  return plan;
}

async function applyImport(plan, st){
  const total = plan.linkPhotos.length + plan.writes.length + plan.stockAdds.length;
  let n = 0;
  const tick = () => { n++; st.textContent = `Saving ${n} of ${total}…`; };
  for (const p of plan.linkPhotos) { const b = await shrink(p.blob); await S.assets.upload(b, {type: b.type || "image/jpeg", id: p.id}); tick(); }
  for (const w of plan.writes) {
    const ref = S.db.collection(w.col).doc(w.id); const data = {...w.data, ...stamp()};
    await (w.isNew ? ref.set(data) : ref.update(data)); tick();
  }
  // expense rows marked Delivered = Yes go into stock
  for (const a of plan.stockAdds) { await deliver(a.expId); tick(); }
}

function excelSheet(){
  $("#sheetRoot").innerHTML = `<div class="overlay" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Excel spreadsheet">
    <h2>Excel spreadsheet</h2>
    <p class="note">Fill in stock, supplier links and expenses in Excel, then bring the changes back in here.</p>
    <div class="xl-step"><b>1. Download</b>
      <span class="note">One file with Stock, Links, Expenses and Sales sheets, plus a short how-to sheet.</span>
      <div class="xl-row"><button type="button" class="btn primary" id="xlDown">Download Excel file</button><span class="note" id="xlDownStatus"></span></div></div>
    <div class="xl-step"><b>Or start from a blank sheet</b>
      <span class="note">The momento upload sheet with drop-down lists and a how-to tab, but no rows yet. Use it to add new stock, links or past expenses. Rows whose name already exists in the app update that entry instead of adding a copy.</span>
      <div><a class="btn" href="momento-upload-sheet.xlsx" download="momento upload sheet.xlsx">Download blank upload sheet</a></div></div>
    ${S.canWrite ? `<div class="xl-step"><b>2. Upload your edited file</b>
      <span class="note">Rows with an ID update that item. Rows with a blank ID are added as new. Nothing gets deleted, and you'll see a summary before anything changes.</span>
      <div><label class="btn" for="xlFile">Choose .xlsx or .csv file</label><input type="file" id="xlFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden></div></div>
      <div id="xlResult"></div>` : ""}
    <div class="actions"><span></span><div class="r"><button type="button" class="btn" data-a="closeSheet">Close</button></div></div>
  </div></div>`;
  $("#xlDown").addEventListener("click", e => downloadXlsx(e.currentTarget, $("#xlDownStatus")));
  const f = $("#xlFile"); if (!f) return;
  f.addEventListener("change", async () => {
    const file = f.files[0]; f.value = ""; if (!file) return;
    const res = $("#xlResult");
    res.innerHTML = `<p class="note">Reading ${esc(file.name)}…</p>`;
    let plan;
    try { plan = await planImport(file); }
    catch(e) { res.innerHTML = `<div class="status">${e?.message==="load" ? "Couldn't load the Excel tool. Check your connection and try again." : "Couldn't read that file. Upload the .xlsx you downloaded from here, or a .csv."}</div>`; return; }
    const c = plan.c, n = plan.writes.length + plan.stockAdds.length + plan.linkPhotos.length;
    res.innerHTML = `<div class="xl-sum">
      <div><b>Stock:</b> <span class="num">${c.sn} new · ${c.sc} changed · ${c.ss} unchanged</span></div>
      <div><b>Links:</b> <span class="num">${c.ln} new · ${c.lc} changed · ${c.ls} unchanged</span></div>
      <div><b>Expenses:</b> <span class="num">${c.en} new · ${c.ec} changed · ${c.es} unchanged</span></div>
      ${plan.linkPhotos.length ? `<div><b>Photos:</b> ${plan.linkPhotos.length} picture${plan.linkPhotos.length===1?"":"s"} found in Links</div>` : ""}
      ${plan.stockAdds.length ? `<div><b>Delivered, going into stock:</b> ${plan.stockAdds.map(a => esc(`${a.qty} ${a.unit} ${a.name}`)).slice(0,5).join(", ")}${plan.stockAdds.length>5?"…":""}</div>` : ""}
      ${plan.warnings.length ? `<ul class="xl-warn">${plan.warnings.slice(0,8).map(w=>`<li>${esc(w)}</li>`).join("")}${plan.warnings.length>8?`<li>…and ${plan.warnings.length-8} more</li>`:""}</ul>` : ""}
      ${n ? `<div><button type="button" class="btn primary" id="xlApply">Apply ${n} change${n===1?"":"s"}</button></div>` : `<p class="note">Nothing to change. The file matches the app.</p>`}
      <p class="note" id="xlApplyStatus"></p></div>`;
    const ap = $("#xlApply"); if (!ap) return;
    ap.addEventListener("click", async () => {
      ap.disabled = true; const st = $("#xlApplyStatus");
      try { await applyImport(plan, st); st.textContent = "Done. The app is updated."; ap.remove(); toast("Spreadsheet imported"); logAct(`uploaded a spreadsheet (${n} change${n===1?"":"s"})`); }
      catch(err) { st.textContent = writeError(err) + " Some rows may already be saved, so download a fresh file before trying again."; }
    });
  });
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-a],[data-tab]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; try{localStorage.setItem("ccsb.tab",S.tab);}catch(e){} render(); window.scrollTo(0,0); return; }
  if (t.closest(".sheet") && !["closeSheet"].includes(t.dataset.a)) return; // sheet handles its own
  const a = t.dataset.a, id = t.dataset.id;
  if (a==="closeSheet") { if (ev.target === t) closeSheet(); return; }
  if (!S.db && !["filt","copy","viewPhoto"].includes(a)) { toast("Data isn't connected yet."); return; }
  switch(a){
    case "filt": S.f[t.dataset.g] = t.dataset.v; render(); break;
    case "viewPhoto": viewPhoto(t.dataset.photo); break;
    case "excel": excelSheet(); break;
    case "lengths": lengthsForm(); break;
    case "newExp": expenseForm(); break;
    case "newPayback": paybackForm(); break;
    case "editPayback": if (S.canWrite) paybackForm(S.settle.find(x => x.id === id)); break;
    case "editWO": if (S.canWrite) woForm(S.deadstock.find(d => d.id === id)); break;
    case "unarchive": {
      const it = itemById(id); if (!it) break;
      try { await S.db.collection("items").doc(id).update({dead:false, ...stamp()}); toast(`${it.name} is back in stock`); logAct(`restored ${it.name} from the archive`); }
      catch(err) { toast(writeError(err)); }
      break;
    }
    case "favLink": {
      const l = linkById(id); if (!l) break;
      try { await S.db.collection("links").doc(id).update({fav: !l.fav}); logAct(`${l.fav ? "removed" : "added"} ${l.title} ${l.fav ? "from" : "to"} favourites`); }
      catch(err) { toast(writeError(err)); }
      break;
    }
    case "buyLink": expenseForm(null, {src: "link:" + id}); break;
    case "deliver": {
      t.disabled = true;
      try { const r = await deliver(id); toast(r ? (r.made ? "Delivered. Added to Stock as a new item" : "Delivered. Added to stock") : "Nothing to add to stock"); }
      catch(err) { t.disabled = false; toast(writeError(err)); }
      break;
    }
    case "editExp": if (S.canWrite) expenseForm(S.expenses.find(x=>x.id===id)); break;
    case "newItem": itemForm(); break;
    case "editItem": if (S.canWrite) itemForm(itemById(id)); break;
    case "newSale": saleForm(); break;
    case "editSale": if (S.canWrite) saleForm(S.sales.find(s=>s.id===id)); break;
    case "newLink": linkForm(); break;
    case "editLink": linkForm(linkById(id)); break;
    case "newShop": shopForm(); break;
    case "editShop": shopForm(S.shop.find(s=>s.id===id)); break;
    case "toList": { const it=itemById(id); shopForm(null,{text:it.name, itemId:it.id, linkId:it.linkId||""}); break; }
    case "inc": case "dec": {
      const it = itemById(id); if (!it) break;
      const step = isM(it) ? 0.1 : 1;
      const next = Math.max(0, Math.round(((it.qty||0) + (a==="inc"?step:-step))*10000)/10000);
      if (it.qty === next) break;
      t.disabled = true;
      try { const before = it.qty; await S.db.collection("items").doc(id).update({qty:next, ...stamp()}); logQty(it, before, next); } catch(err){ toast(writeError(err)); }
      t.disabled = false; break;
    }
    case "tick": {
      const s = S.shop.find(x=>x.id===id);
      try {
        await S.db.collection("shop").doc(id).update(t.checked ? {done:true, doneBy:S.me, doneWho:S.who||"", doneAt:Date.now()} : {done:false, doneBy:"", doneWho:""});
        if (s) logAct(t.checked ? `ticked ${s.text} as bought` : `unticked ${s.text}`);
      }
      catch(err){ t.checked = !t.checked; toast(writeError(err)); }
      break;
    }
    case "clearDone": {
      if (!t.classList.contains("armed")) { t.classList.add("btn","danger","armed"); t.textContent="Tap again to clear"; setTimeout(()=>{ if(t.isConnected){t.classList.remove("danger","armed"); t.textContent="Clear ticked items";} },3500); break; }
      for (const s of S.shop.filter(x=>x.done)) { try { await S.db.collection("shop").doc(s.id).delete(); } catch(err){ toast(writeError(err)); break; } }
      toast("Cleared"); break;
    }
    case "copy": {
      const l = linkById(id);
      try { await navigator.clipboard.writeText(l.url); toast("Link copied"); }
      catch(e){ toast(l.url); }
      break;
    }
  }
});

function dbError(e){
  if (e && (e.code === "42501" || /row-level security|permission denied/i.test(e.message || ""))) return {code:"invalid_argument", message:e.message};
  return {code:"unavailable", message:(e && e.message) || "error"};
}

// A small store with the same shape the app already uses (collections of JSON docs,
// live updates), kept in one Supabase table: docs(col, id, data).
function makeDb(sb){
  const cache = {}, listeners = {}, loading = {};
  const emit = col => (listeners[col] || new Set()).forEach(fn => { try { fn(); } catch(e) { console.error(e); } });
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16) + Math.random().toString(16).slice(2)).replace(/-/g,"").slice(0,20);
  async function load(col){
    const {data, error} = await sb.from("docs").select("id,data").eq("col", col).limit(10000);
    if (error) throw error;
    cache[col] = new Map(data.map(r => [r.id, r.data])); emit(col);
  }
  sb.channel("docs-changes").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, p => {
    const row = p.eventType === "DELETE" ? p.old : p.new;
    if (!row || !cache[row.col]) return;
    if (p.eventType === "DELETE") cache[row.col].delete(row.id); else cache[row.col].set(row.id, row.data);
    emit(row.col);
  }).subscribe();
  function subscribe(col, fn, err){
    (listeners[col] ||= new Set()).add(fn);
    if (cache[col]) fn();
    else if (!loading[col]) loading[col] = load(col).catch(e => { loading[col] = null; if (err) err(dbError(e)); });
    return () => listeners[col].delete(fn);
  }
  const local = (col, id, data) => {
    if (!cache[col]) return;
    if (data === undefined) cache[col].delete(id); else cache[col].set(id, data);
    emit(col);
  };
  function docRef(col, id){
    return {
      id, path: col + "/" + id,
      async get(){
        let d = cache[col] ? cache[col].get(id) : undefined;
        if (!cache[col]) { const {data, error} = await sb.from("docs").select("data").eq("col", col).eq("id", id).maybeSingle(); if (error) throw dbError(error); d = data ? data.data : undefined; }
        return {id, exists: d !== undefined, data: () => d};
      },
      async set(data){
        const {error} = await sb.from("docs").upsert({col, id, data, updated_at: new Date().toISOString()});
        if (error) throw dbError(error);
        local(col, id, data);
      },
      async update(patch){
        const cur = await this.get();
        if (!cur.exists) throw {code:"invalid_argument", message:"Document not found"};
        await this.set({...cur.data(), ...patch});
      },
      async delete(){
        const {data, error} = await sb.from("docs").delete().eq("col", col).eq("id", id).select("id");
        if (error) throw dbError(error);
        if (!data || !data.length) { if (cache[col] && cache[col].has(id)) throw {code:"invalid_argument", message:"Not allowed"}; }
        local(col, id, undefined);
      },
      onSnapshot(next, err){
        return subscribe(col, () => { const d = cache[col].get(id); next({id, exists: d !== undefined, data: () => d, metadata:{fromCache:false, hasPendingWrites:false}}); }, err);
      }
    };
  }
  function query(col, ord, lim){
    return {
      path: col,
      orderBy: (f, dir = "asc") => query(col, {f, dir}, lim),
      limit: n => query(col, ord, n),
      doc: id => docRef(col, id || newId()),
      async add(data){ const r = docRef(col, newId()); await r.set(data); return r; },
      onSnapshot(next, err){
        return subscribe(col, () => {
          let docs = [...cache[col].entries()].map(([id, d]) => ({id, exists:true, data: () => d, metadata:{fromCache:false}}));
          if (ord) docs.sort((a, b) => { const x = a.data()[ord.f], y = b.data()[ord.f]; const c = x < y ? -1 : x > y ? 1 : 0; return ord.dir === "desc" ? -c : c; });
          if (lim) docs = docs.slice(0, lim);
          next({docs, size: docs.length, empty: !docs.length, metadata:{fromCache:false, hasPendingWrites:false}, docChanges: () => []});
        }, err);
      }
    };
  }
  return {
    newId,
    collection: c => query(c),
    doc: p => { const [c, id] = p.split("/"); return docRef(c, id); },
    refresh: () => Object.keys(cache).forEach(c => load(c).catch(() => {}))
  };
}

(async () => {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const cfg = window.MOMENTO_CONFIG || {};
  const offline = msg => { Object.keys(S.loaded).forEach(k => S.loaded[k] = true); S.canWrite = false; setStatus(msg); render(); };
  if (!window.supabase) return offline("Couldn't load the app. Check your internet connection and open it again.");
  if (!cfg.supabaseUrl || /YOUR_/.test(cfg.supabaseUrl + cfg.supabaseKey)) return offline("The app isn't connected to its database yet.");
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true}});
  let {data:{session}} = await sb.auth.getSession();
  // "Keep me signed in" unticked: sign out once the app has been closed.
  let temp = false, live = false;
  try { temp = localStorage.getItem("momento.temp") === "1"; live = sessionStorage.getItem("momento.live") === "1"; } catch(e) {}
  if (session && temp && !live) { await sb.auth.signOut(); session = null; }
  if (!session) {
    $("#login").hidden = false;
    $("#loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = $("#lBtn"), msg = $("#lMsg");
      btn.disabled = true; msg.textContent = "Signing in…";
      const {error} = await sb.auth.signInWithPassword({email: $("#lEmail").value.trim(), password: $("#lPass").value});
      if (error) { btn.disabled = false; msg.textContent = /invalid/i.test(error.message) ? "Wrong email or password." : "Couldn't sign in. Check your connection and try again."; return; }
      try {
        if ($("#lKeep").checked) localStorage.removeItem("momento.temp");
        else { localStorage.setItem("momento.temp", "1"); sessionStorage.setItem("momento.live", "1"); }
      } catch(e) {}
      location.reload();
    });
    return;
  }
  start(sb, session);
})();

async function start(sb, session){
  const timer = setTimeout(() => { if (Object.values(S.loaded).some(v => !v)) setStatus("Still connecting… If this stays, check your internet connection."); }, 10000);
  S.me = session.user.id;
  const so = $("#signOut"); so.hidden = false;
  so.addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
  const {data: member, error: memberErr} = await sb.rpc("is_member");
  if (!memberErr && member === false) { S.canWrite = false; setStatus(`${session.user.email} isn't on the momento list yet. Add it in Supabase (members table), then reopen the app.`); }
  // Who is using this phone comes from the login: each email is linked to a name in Supabase.
  const {data: myName} = await sb.rpc("my_name");
  if (PEOPLE.includes(myName)) { S.who = myName; try { localStorage.setItem("momento.who", myName); } catch(e) {} S.autoWho = true; render(); }
  const db = makeDb(sb); S.db = db;
  S.assets = {
    upload: async (blob, opt = {}) => {
      const id = opt.id || db.newId() + ".jpg";
      const {error} = await sb.storage.from("photos").upload(id, blob, {contentType: opt.type || "image/jpeg", cacheControl: "31536000", upsert: false});
      if (error && !(opt.id && /exist|duplicate/i.test(error.message))) throw {code: /exceed|too large|size/i.test(error.message) ? "too_large" : /mime|type/i.test(error.message) ? "unsupported_type" : "upstream_error", message: error.message};
      return {id, url: photoSrc(id)};
    }
  };
  S.downloads = {
    save: async ({filename, data}) => {
      const type = /\.xlsx$/.test(filename) ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : "";
      const url = URL.createObjectURL(new Blob([data], {type}));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 15000);
      return {status: "saved"};
    }
  };
  document.addEventListener("visibilitychange", () => { if (!document.hidden) db.refresh(); });
  db.collection("activity").orderBy("at","desc").limit(30).onSnapshot(snap => {
    S.activity = snap.docs.map(d => ({id:d.id, ...d.data()})); S.loaded.activity = true; render();
  }, () => { S.loaded.activity = true; render(); });
  if (!S.who && S.canWrite) whoPicker();
  db.doc("config/lengths").onSnapshot(d => { S.lengths = {...DEFAULT_LEN, ...(d.exists ? d.data() : {})}; }, () => {});
  for (const k of ["items","sales","links","shop","expenses","deadstock","settle"]) {
    db.collection(k).onSnapshot(snap => {
      S[k] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      S.loaded[k] = true;
      if (Object.values(S.loaded).every(Boolean)) { clearTimeout(timer); if (S.canWrite) setStatus(""); }
      render();
    }, () => { S.loaded[k] = true; clearTimeout(timer); setStatus("Couldn't load some data. Close the app and open it again."); render(); });
  }
}
})();
